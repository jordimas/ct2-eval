[project]
name = "ct2-vllm-benchmark"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "ctranslate2>=4.4",
    "transformers",
    "huggingface_hub",
    "llama-cpp-python",
    "vllm-cpu==0.21.0",
    "sglang[runtime-common]",
    "optimum-intel[openvino]",
    "optimum[onnxruntime]",
    "datasets>=2.0",
    "torch==2.11.0+cpu",
    "torchvision==0.26.0+cpu",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
